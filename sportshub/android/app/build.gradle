plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sportshub.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sportshub.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A checked-in debug keystore so every build (your laptop, GitHub Actions) signs with the
    // same key and `pm install -r` upgrades in place. It is a throwaway key for a sideloaded app.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // The page itself ships inside the APK: static/ (html, css, js, fonts, config.json) becomes
    // file:///android_asset/. The user's own files (config.json, media/, fonts/custom/) live in the
    // app's external files dir, pushed with adb.
    sourceSets {
        main {
            assets.srcDirs += ['../../static']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: a WebView, an Activity and nothing else. The 2026 Onn 4K stick has
// 2 GB of RAM and 8 GB of storage, so the APK stays under 100 KB.
dependencies {
}
